name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=order_integration \
            --cov-report=term-missing \
            --cov-fail-under=80

  container:
    name: Build and smoke test container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag order-integration-service:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name order-integration \
            --publish 8080:8080 \
            order-integration-service:ci

      - name: Wait for readiness
        run: |
          for attempt in {1..20}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health/ready; then
              exit 0
            fi

            sleep 1
          done

          echo "Container did not become ready"
          docker logs order-integration
          exit 1

      - name: Show container status
        run: docker inspect order-integration --format '{{json .State}}'

      - name: Remove container
        if: always()
        run: docker rm --force order-integration