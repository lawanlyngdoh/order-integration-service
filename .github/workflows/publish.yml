name: Publish container

on:
  workflow_run:
    workflows:
      - Application CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish multi-platform image
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.title=Order Integration Service
            org.opencontainers.image.description=Enterprise-style order integration API
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Display published digest
        run: echo "Published digest ${{ steps.build.outputs.digest }}"

      - name: Verify GitOps automation token
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_AUTOMATION_TOKEN }}
        run: |
          if [ -z "${GITOPS_TOKEN}" ]; then
            echo "GITOPS_AUTOMATION_TOKEN is not configured"
            exit 1
          fi

      - name: Check out GitOps repository
        uses: actions/checkout@v7
        with:
          repository: lawanlyngdoh/order-integration-gitops
          token: ${{ secrets.GITOPS_AUTOMATION_TOKEN }}
          path: gitops
          fetch-depth: 0

      - name: Open dev deployment pull request
        working-directory: gitops
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITOPS_AUTOMATION_TOKEN }}
          GH_REPO: lawanlyngdoh/order-integration-gitops
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: ${IMAGE_DIGEST}"
            exit 1
          fi

          BRANCH_NAME="automation/dev-${SOURCE_SHA}"
          MANIFEST="apps/order-integration/overlays/dev/kustomization.yaml"

          git fetch origin main
          git fetch \
            origin \
            "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || true

          git switch \
            --force-create "${BRANCH_NAME}" \
            origin/main

          python - "${MANIFEST}" "${IMAGE_DIGEST}" <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          digest = sys.argv[2]

          pattern = re.compile(
              r"(?P<prefix>"
              r"  - name: ghcr\.io/lawanlyngdoh/order-integration-service\n"
              r"    digest: )"
              r"sha256:[0-9a-f]{64}"
          )

          original = manifest.read_text()
          updated, replacements = pattern.subn(
              rf"\g<prefix>{digest}",
              original,
          )

          if replacements != 1:
              raise SystemExit(
                  f"Expected one image digest replacement, found {replacements}"
              )

          manifest.write_text(updated)
          PY

          if git diff --quiet -- "${MANIFEST}"; then
            echo "Dev already references ${IMAGE_DIGEST}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${MANIFEST}"
          git commit \
            --message "Deploy order integration ${SOURCE_SHA:0:12} to dev"

          git push \
            --force-with-lease \
            --set-upstream origin \
            "${BRANCH_NAME}"

          PR_URL="$(
            gh pr list \
              --head "${BRANCH_NAME}" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"

          if [ -z "${PR_URL}" ]; then
            PR_URL="$(
              gh pr create \
                --base main \
                --head "${BRANCH_NAME}" \
                --title "Deploy order integration ${SOURCE_SHA:0:12} to dev" \
                --body "Automated dev promotion from service commit ${SOURCE_SHA}. Image digest: ${IMAGE_DIGEST}."
            )"
          fi

          echo "GitOps pull request: ${PR_URL}"